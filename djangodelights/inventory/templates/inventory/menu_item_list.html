{% extends 'inventory/base.html' %}

{% block content %}
<table>
    <tr>
        <th>Menu Item</th>
        <th>Price</th>
        <th>Description</th>
    </tr>
    {% for item in menuitem_list %}
        <tr>
            <td>{{item.name}}</td>
            <td>{{item.price}}</td>
            <td>{{item.description}}</td>
        </tr>
    {% endfor %}
</table>
{% endblock %}
